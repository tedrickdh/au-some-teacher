name: Deploy React Site to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build React website
        working-directory: frontend
        run: yarn build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

  
        - name: Diagnose Hostinger FTP path
  env:
    FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
    FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
    FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  run: |
    lftp -c "
    set ftp:ssl-allow no;
    set cmd:fail-exit yes;

    open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";

    echo '===== CURRENT FTP DIRECTORY =====';
    pwd;

    echo '===== FILES AT FTP ROOT =====';
    cls -la;

    echo '===== PUBLIC_HTML CONTENTS, IF AVAILABLE =====';
    cls -la public_html || true;

    echo '===== DOMAINS CONTENTS, IF AVAILABLE =====';
    cls -la domains || true;

    bye;
    "
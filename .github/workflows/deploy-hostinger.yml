name: Diagnose Hostinger FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-hostinger:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Inspect Hostinger FTP directories
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 20

          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"

          echo ===== CURRENT FTP DIRECTORY =====
          pwd

          echo ===== FILES AT FTP ROOT =====
          cls -la

          echo ===== PUBLIC_HTML CONTENTS =====
          cls -la public_html

          echo ===== DOMAINS CONTENTS =====
          cls -la domains

          echo ===== DOMAIN-SPECIFIC DIRECTORY =====
          cls -la domains/au-someteacher.com

          echo ===== DOMAIN PUBLIC_HTML =====
          cls -la domains/au-someteacher.com/public_html

          bye
          EOF